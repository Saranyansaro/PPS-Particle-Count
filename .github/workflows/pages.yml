# Tests the app, then publishes the static/ folder to GitHub Pages on every push to main.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Calculation tests
        run: node --test tests/calc.test.js
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Server tests (oldest supported Python)
        run: python -m unittest discover -s tests -v

  # Real browser runs: iPhone (WebKit) and laptop (Chromium). Reported separately; they don't hold up publishing.
  browser-tests:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Playwright browsers
        working-directory: tests/e2e
        run: npm ci && npx playwright install --with-deps webkit chromium
      - name: iPhone and laptop journey
        working-directory: tests/e2e
        run: node journey.mjs
      - name: Laptop server outage while typing
        working-directory: tests/e2e
        run: node outage.mjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Stamp this release into the offline cache name
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/" static/sw.js && grep -n "const CACHE" static/sw.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: static
      - id: deployment
        uses: actions/deploy-pages@v5
